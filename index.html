<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Portfolio</title>
  <link href="https://fonts.googleapis.com/css2?family=Aclonica&family=Kumar+One&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ===== NAVIGATION ===== -->
  <nav class="nav-grid">
    <div class="brand box" id="brand">MY PORTFOLIO</div>

    <!-- Hamburger menu icon -->
    <div class="menu-toggle" id="menu-toggle">&#9776;</div>

    <ul id="nav-links" class="box">
      <li><a href="index.html">HOME</a></li>
      <li><a href="about.html">ABOUT</a></li>
      <li><a href="contact.html">CONTACT US</a></li>
    </ul>
  </nav>

  <!-- ===== MAIN PORTFOLIO ===== -->
  <div class="container box" id="main-portfolio">
    <div class="portrait box">
      <img src="mypicture.jpg" alt="Profile">
    </div>
    <div class="intro box">
      <div class="hello box">HELLO IT'S ME</div>
      <div class="name box">WENGELINE D. PALUMAR</div>
      <div class="degree box">BS INFORMATION TECHNOLOGY STUDENT</div>
    </div>
  </div>

  <!-- ===== JS for Hamburger ===== -->
  <script>
    const menuToggle = document.getElementById('menu-toggle');
    const navLinks = document.getElementById('nav-links');

    menuToggle.addEventListener('click', () => {
      navLinks.classList.toggle('active');
      menuToggle.classList.toggle('open');
    });
  </script>

</body>
</html>
